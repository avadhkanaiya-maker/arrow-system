instructions: 'Link cards: the image (or else the card’s Icon) on top, the Subtitle as a small heading above the title and the link’s Label (e.g. “View films”) at the bottom; the heading is centred. For “More from …” sections. Image tiles: the title on the image (e.g. industries). Image cards: no box, the image framed, then title and text (e.g. pouch formats).'
